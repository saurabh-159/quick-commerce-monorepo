name: Deploy to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "========== [1/4] Navigating to Project =========="
            cd ~/quick-commerce-monorepo

            echo "========== [2/4] Pulling Fresh Code from GitHub =========="
            git fetch origin main
            git reset --hard origin/main

            echo "========== [3/4] Rebuilding Docker Containers =========="
            # Force recreate aur build bina purane cache ke
            docker compose down --remove-orphans
            docker compose build --no-cache
            docker compose up -d

            echo "========== [4/4] Verifying Containers Status =========="
            sleep 5
            docker compose ps

            echo "Deployment Completed Successfully!"